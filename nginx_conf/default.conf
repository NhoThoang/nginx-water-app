limit_req_zone $binary_remote_addr zone=one:10m rate=20r/s;
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

# 1. Tối ưu Gzip - Giảm dung lượng truyền tải cho JS/CSS/HTML
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    # Security Headers cơ bản
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # 2. Frontend (Next.js)
    location / {
        limit_req zone=one burst=50 nodelay;

        proxy_pass http://nextjs_frontend:3000;
        proxy_redirect off;
        proxy_buffering off;

        add_header Cache-Control "no-cache, public, must-revalidate, proxy-revalidate";
        
        proxy_cache my_cache;
        proxy_cache_valid 200 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. File tĩnh của Frontend (CSS, JS, Images)
    location /_next/static/ {
        proxy_pass http://nextjs_frontend:3000/_next/static/;
        
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        proxy_cache my_cache;
        proxy_cache_valid 200 365d;
        add_header X-Cache-Status $upstream_cache_status;
        
        access_log off;
    }

    # 4. Backend (FastAPI) - APIs
    location /api/v1/ {
        limit_req zone=one burst=20 nodelay;

        proxy_pass http://fastapi_server:8001/api/v1/;
        
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        add_header Cache-Control "no-store, no-cache, must-revalidate";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        limit_req zone=one burst=100 nodelay;

        proxy_pass http://minio-server:9000/uploads/;
        
        proxy_buffering on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        
        proxy_cache my_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_set_header Host minio-server:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }
}